<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vuelos Disponibles</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="header-top">
        <h1>Vuelos Disponibles</h1>
        <div class="origin-badge">Madrid (MAD)</div>
    </div>

    <div class="main-container">
        <aside class="filters-panel">
            <h2>Filtros</h2>
            
            <div class="filter-group">
                <label for="destFilter">Destino</label>
                <select id="destFilter">
                    <option value="Berlín">Berlín</option>
                    <option value="Londres">Londres</option>
                    <option value="París">París</option>
                    <option value="Roma">Roma</option>
                    <option value="Ámsterdam">Ámsterdam</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="priceFilter">Precio máximo (€)</label>
                <input type="range" id="priceFilter" min="20" max="500" value="500">
            </div>

            <div class="filter-group">
                <label for="companyFilter">Compañía</label>
                <select id="companyFilter">
                    <option value="Todas">Todas</option>
                    <option value="Ryanair">Ryanair</option>
                    <option value="Vueling">Vueling</option>
                    <option value="Iberia">Iberia</option>
                    <option value="Air Europa">Air Europa</option>
                    <option value="EasyJet">EasyJet</option>
                </select>
            </div>
        </aside>

        <main class="calendar-container">
            <div class="calendar-header" id="calendarHeader">
                <div class="time-header-cell">Hora</div>
                </div>
            
            <div class="calendar-body" id="calendarBody">
                </div>
        </main>
    </div>

    <script src="main.js"></script>
</body>
</html>
